<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Loja</h1>
        <nav>
            <ul>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#cesto">Cesto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="produtos">
            <h1>Selecione os seus Produtos</h1>
            <section id="filtros">
                <label for="filtro-categoria">Filtrar</label>
                <select id="filtro-categoria">
                    <option value="T">Todas as categorias</option>
                </select>

                <label for="ordenar">Ordenar</label>
                <select id="ordenar">
                    <option value="">Ordenar pelo preço</option>
                    <option value="crescente">Preço crescente</option>
                    <option value="decrescente">Preço decrescente</option>
                </select>

                <label for="procurar">Procurar</label>
                <input type="text" id="procurar" placeholder="pesquise por produto">
            </section>
        </section>
        <section id="cesto">
            <h1>Produtos Selecionados</h1>
            <p id="preco"></p>
        </section>
    </main>
    <footer></fonter>

    <script src="scripts/main.js"></script>
</body>
<footer>2026</footer>
</html>
